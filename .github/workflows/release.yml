name: Publish Release to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run pytest
        run: uv run pytest

      - name: Run ruff check & format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run JavaScript tests
        run: node --test "tests/js/*.test.mjs"

  pypi-publish:
    name: Build & Publish to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agy-remote
    permissions:
      id-token: write # Required for OIDC trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build distribution packages
        run: uv build

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub Release
    needs: [pypi-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag alone leaves nothing on the Releases page, and it drifted:
      # eight tags shipped to PyPI with no release to read. The notes are the
      # changelog section for this exact version, so there is one source.
      - name: Extract this version's changelog section
        id: notes
        run: |
          python3 - "$GITHUB_REF_NAME" <<'EOF' > release-notes.md
          import re, sys
          tag = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # "v26.08.22.35" -> the "## v26.08.22.35 — ..." section
          match = re.search(rf"^## {re.escape(tag)}\b.*?$(.*?)(?=^## |\Z)", text, re.S | re.M)
          print((match.group(1).strip() if match else f"See CHANGELOG.md for {tag}."))
          EOF
          echo "Wrote $(wc -l < release-notes.md) lines of notes"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(grep -m1 "^## ${GITHUB_REF_NAME}" CHANGELOG.md | sed "s/^## //")
          gh release create "$GITHUB_REF_NAME" \
            --title "${title:-$GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
