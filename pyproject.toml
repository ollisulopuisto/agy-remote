[project]
name = "agy-remote"
version = "26.8.22.31"
description = "Mobile Remote Web Controller & PWA for Antigravity CLI (agy)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Olli Sulopuisto" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.7",
    "cryptography>=50.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.4",
    "pydantic>=2.8.0",
    "pyte>=0.8.2",
    "python-multipart>=0.0.9",
    "pywebpush>=2.4.0",
    "qrcode[pil]>=7.4.2",
    "rich>=13.7.0",
    "uvicorn[standard]>=0.30.0",
    "watchfiles>=0.23.0",
    "websockets>=12.0",
]

[project.scripts]
agy-remote = "agy_remote:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
